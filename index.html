cent-ink:#fff8f3;--stage:#ebc3b3;--danger:#b3303f;--gold:#b98a63;--blue:#3f6bc4;\n  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#171b38;--panel:#1f2548;--panel2:#282f5a;--ink:#f6dccf;--mute:#b5a4b9;--line:#434c86;\n    --accent:#f08f7c;--accent-ink:#171b38;--stage:#121530;--danger:#ff8b98;--gold:#d2a584;--blue:#7b9be0;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#171b38;--panel:#1f2548;--panel2:#282f5a;--ink:#f6dccf;--mute:#b5a4b9;--line:#434c86;\n  --accent:#f08f7c;--accent-ink:#171b38;--stage:#121530;--danger:#ff8b98;--gold:#d2a584;--blue:#7b9be0;\n}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);\n  font:14px/1.4 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}\nbutton,select,input{font:inherit;color:inherit}\nbutton{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}\nbutton:hover{border-color:var(--accent)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbutton.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}\nbutton[aria-pressed=\"true\"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}\nselect,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}\ninput[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}\ninput[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}\n.brand{display:flex;align-items:baseline;gap:12px}\n.brand strong{font-size:20px;font-weight:600;letter-spacing:-.02em}\n.brand span{color:var(--mute)}\n.actions{display:flex;gap:8px;flex-wrap:wrap}\n\nmain{flex:1;min-height:0;display:grid;grid-template-columns:370px minmax(0,1fr) 336px;gap:1px;background:var(--line)}\n.lib,.stack{background:var(--panel);overflow-y:auto;min-height:0}\n.pad{padding:12px 14px}\nh2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink)}\nh3{font-size:12.5px;font-weight:600;margin:16px 0 6px;color:var(--mute)}\n.search{margin-bottom:10px}\n.presets{display:flex;flex-wrap:wrap;gap:6px}\n.presets button{padding:4px 9px;font-size:13px}\n.fxbtn{display:block;width:100%;text-align:left;margin:0 0 4px;padding:7px 10px;background:transparent;border-color:transparent}\n.fxbtn:hover{background:var(--panel2);border-color:var(--line)}\n.fxbtn b{font-weight:500;display:block}\n.fxbtn small{color:var(--mute);font-size:12px}\n\n.stage{background:var(--stage);display:flex;flex-direction:column;min-width:0;min-height:0}\n.viewport{flex:1;min-height:0;position:relative}\n.viewport canvas{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;display:none}\n.viewport.has canvas{display:block}\n.viewport.actual{display:flex;overflow:auto;padding:18px}\n.viewport.actual canvas{position:static;flex:none;margin:auto;width:auto;height:auto;object-fit:none;image-rendering:pixelated}\n.drop{position:absolute;inset:18px;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:10px;text-align:center;padding:20px}\n.viewport.has .drop{display:none}\nbody.dragging .drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}\n.drop h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}\n.drop p{margin:0 0 16px;color:var(--mute);max-width:42ch}\n.drop .row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}\n.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}\n.bar .grp{display:flex;align-items:center;gap:8px}\n.bar select{width:auto}\n.bar .dim{color:var(--mute)}\n\n.stackhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}\n.stackhead small{color:var(--mute)}\n.hint{color:var(--mute);font-size:12.5px;margin:0 0 10px}\n.empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--mute);text-align:center}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}\n.card.off{opacity:.55}\n.chead{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 4px}\n.chead .title{flex:1;display:flex;align-items:center;gap:6px;background:none;border:none;text-align:left;font-weight:600;padding:6px 6px}\n.chead .title .chev{transition:transform .15s}\n.card.open .chev{transform:rotate(90deg)}\n.ib{background:none;border:none;padding:6px;border-radius:5px;display:grid;place-items:center;color:var(--mute)}\n.ib:hover{background:var(--panel);color:var(--ink)}\n.ib.del:hover{color:var(--danger)}\n.ib[disabled]{opacity:.3;cursor:default}\n.cbody{display:none;padding:2px 12px 12px;border-top:1px solid var(--line)}\n.card.open .cbody{display:block}\n.row{margin-top:10px}\n.row .l{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:12.5px}\n.row .l output{color:var(--ink)}\n.row.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.row.inline .l{color:var(--mute)}\n.none{color:var(--mute);margin:10px 0 0;font-size:12.5px}\n.mix{margin-top:12px;padding-top:2px;border-top:1px dashed var(--line)}\n#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}\n#toast.show{opacity:1;transform:translate(-50%,0)}\n\n@media (max-width:920px){\n  html,body{height:auto;min-height:100%}\n  main{grid-template-columns:1fr;display:flex;flex-direction:column}\n  .stage{order:-1;height:62vh;flex:none}\n  .lib,.stack{overflow:visible;max-height:none}\n  .brand span{display:none}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\n/* ===== Art déco, doux ===== */\nbody{letter-spacing:.01em}\n.top{padding:12px 18px;border-bottom:none;position:relative;\n  background:linear-gradient(var(--panel),var(--panel))}\n.top::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:5px;\n  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.7}\n.brand strong{font-family:'Poiret One','Jost',sans-serif;font-weight:400;font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);padding-left:.22em}\n.brand span{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}\n.brand{position:relative;padding-left:50px;min-height:38px;align-items:center}\n.brand::before{content:\"\";position:absolute;left:0;top:50%;width:38px;height:38px;transform:translateY(-50%);background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAABuCAYAAADGWyb7AAAKMWlDQ1BJQ0MgUHJvZmlsZQAAeJydlndUU9kWh8+9N71QkhCKlNBraFICSA29SJEuKjEJEErAkAAiNkRUcERRkaYIMijggKNDkbEiioUBUbHrBBlE1HFwFBuWSWStGd+8ee/Nm98f935rn73P3Wfvfda6AJD8gwXCTFgJgAyhWBTh58WIjYtnYAcBDPAAA2wA4HCzs0IW+EYCmQJ82IxsmRP4F726DiD5+yrTP4zBAP+flLlZIjEAUJiM5/L42VwZF8k4PVecJbdPyZi2NE3OMErOIlmCMlaTc/IsW3z2mWUPOfMyhDwZy3PO4mXw5Nwn4405Er6MkWAZF+cI+LkyviZjg3RJhkDGb+SxGXxONgAoktwu5nNTZGwtY5IoMoIt43kA4EjJX/DSL1jMzxPLD8XOzFouEiSniBkmXFOGjZMTi+HPz03ni8XMMA43jSPiMdiZGVkc4XIAZs/8WRR5bRmyIjvYODk4MG0tbb4o1H9d/JuS93aWXoR/7hlEH/jD9ld+mQ0AsKZltdn6h21pFQBd6wFQu/2HzWAvAIqyvnUOfXEeunxeUsTiLGcrq9zcXEsBn2spL+jv+p8Of0NffM9Svt3v5WF485M4knQxQ143bmZ6pkTEyM7icPkM5p+H+B8H/nUeFhH8JL6IL5RFRMumTCBMlrVbyBOIBZlChkD4n5r4 ;line-height:0}\n.cstage canvas{display:block;border-radius:4px}\n.cbox{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:1.5px solid #fff;cursor:move;background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35));background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0;background-repeat:no-repeat}\n.chd{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;display:flex;align-items:center;justify-content:center}\n.chd::after{content:\"\";width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:3px}\n.chd[data-h=\"n\"],.chd[data-h=\"s\"],.chd[data-h=\"e\"],.chd[data-h=\"w\"]{cursor:pointer}\n.chd.nr{display:none}\n@media (max-width:1023px){.dsk{display:none}}\n/* Flèche de retour en haut du menu Effets */\n.toTop{position:sticky;bottom:10px;z-index:6;display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;margin:6px 4px 0 auto;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}\n.toTop:hover{filter:brightness(1.2)}\n\n/* ===== Sélecteur de page (position fixe, identique sur les deux pages) ===== */\n.swp{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 14px);left:224px;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}\n.swp button{border:0;border-radius:999px;padding:8px 18px;font:400 15px/1.2 'Poiret One','Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;background:transparent;color:var(--ink);box-shadow:none;cursor:pointer}\n.swp button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);borde :16px 18px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}\n.expdl h3{margin:0 0 12px;font-size:17px;font-weight:600}\n.expf{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.expf button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 11px;border-radius:10px}\n.expf button b{font-size:15px;font-weight:600}\n.expf button small{font-size:11.5px;line-height:1.3;color:var(--mute)}\n.expq{margin-top:12px}\n.expq[hidden]{display:none}\n.expq label{display:flex;justify-content:space-between;font-size:13px}\n.expi{margin:12px 0 0;min-height:1.4em;font-size:12.5px;color:var(--mute)}\n.expb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}\n#dims{display:none!important}\n:root{--s8:rgba(198,224,170,.45)}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--s8:rgba(150,210,120,.13)}}\n:root[data-theme=\"dark\"]{--s8:rgba(150,210,120,.13)}\n.sec{border-radius:16px;padding:10px 12px;margin:14px 0 0}\n.s8{background:var(--s8)}\n.xp h2{display:block;text-align:center;margin:0 0 8px;font-family:'Poiret One','Jost',sans-serif;font-weight:400;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}\n.xp h2::after{display:none}\n.xp .xr{display:flex;gap:6px;align-items:center}\n.xp select{width:auto;flex:1 1 0;min-width:0;padding:3px 6px;font-size:12px;border-radius:9px}\n.xp button{padding:4px 11px;font-size:12px;line-height:1.2;border-radius:9px;white-space:nowrap;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}\n.xp button:hover{background:var(--ink);color:var(--bg)}\n.xp .xqr{margin-top:6px;font-size:12px}.xp .xqr[hidden]{display:none}.xp .xqr label{display:flex;justify-content:space-between}.xp .xqr input{width:100%;accent-color:var(--accent);margin:2px 0 0}\n.xp p{margin:4px 0 0;font-size:11px;line-height:1.3;color:var(--mute)}\n\n/* ===== Responsive ===== */\n@media(max-width:380px){\n  .swp button{padding:5px 8px;font-size:11px;letter-spacing:.06em}\n  .actions{gap:4px}.actions button{padding:5px 9px;font-size:12px}\n}\n@media(pointer:coarse){\n  .actions button,.bar button,.bar select,.stackbar button,.xp button,.xp select{min-height:38px}\n  .xp input[type=range]{min-height:28px}\n}\n@media(max-width:1023px){.xp{margin-bottom:8px}}\n\n/* ===== Mobile v7 : même mise en page qu'Abstrait (image fixe en haut, effets en bande, réglages dessous, le tout défile) ===== */\n@media (max-width:1023px){\n  .mobtog,.toTop{display:none!important}\n  main{display:flex;flex-direction:column;grid-template-rows:none;gap:10px;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}\n  .stage{order:0;position:sticky;top:0;z-index:8;flex:none;grid-row:auto;grid-column:auto;height:clamp(200px,36dvh,520px)!important;border-radius:16px}\n  .bar{display:flex;justify-content:flex-start;flex-wrap:nowrap;border-top:0;padding:2px 10px 8px}\n  .bar .grp:last-child{display:none}\n  .lib{order:1;flex:none;display:flex;flex-direction:column;grid-row:auto;grid-column:auto;overflow:visible;touch-action:auto;padding:10px 12px;border-radius:16px}\n  .libtitle{display:flex!important;order:0;margin:0 0 6px}\n  #library{order:1;display:flex!important;flex-direction:row;gap:8px;overflow-x:auto!important;overflow-y:hidden!important;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}\n  #library>h3,#library>h3.grp{display:none!important}\n  #library .fxbtn{flex:none;flex-direction:column;align-items:center;width:112px;margin:0;padding:8px;gap:6px;text-align:center;border:0;border-radius:12px;scroll-snap-align:start}\n  #library .fxbtn .fxt{width:88px;height:88px;aspect-ratio:auto}\n  #library .fxbtn b{font-size:13px}\n  #library .fxbtn small{display:none}\n  .stack{order:2;flex:none;grid-row:auto;grid-column:auto;overflow:visible;padding:10px 12px;border-radius:16px}\n  .stackhead{posit k\"> une image<\/span><\/button>\n    <button id=\"btnCompare\" type=\"button\" title=\"Maintenir pour voir l'original\">Comparer<\/button>\n    <button id=\"btnActual\" type=\"button\" aria-pressed=\"false\">Taille réelle<\/button>\n    <button id=\"btnSavePhoto\" type=\"button\" class=\"primary\">Enregistrer<\/button>\n  <\/div>\n<\/header>\n\n<main>\n  <aside class=\"lib pad\" aria-label=\"Bibliothèque d'effets\">\n    <button type=\"button\" class=\"mobtog\" id=\"togFx\" aria-expanded=\"true\">Effets<\/button>\n    <h2 class=\"libtitle\">Effets<\/h2>\n    <div id=\"tabFx\">\n    <h2>Préréglages<\/h2>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <h3 style=\"margin-top:18px\">Mes listes<\/h3>\n    <div class=\"presets\" id=\"mylists\"><\/div>\n    <div class=\"listtools\"><button type=\"button\" id=\"btnListExp\" class=\"ib\" title=\"Sauvegarder mes listes dans un fichier\">Exporter<\/button><button type=\"button\" id=\"btnListImp\" class=\"ib\" title=\"Charger des listes depuis un fichier\">Importer<\/button><input type=\"file\" id=\"listFile\" accept=\".json,application/json\" hidden><\/div>\n    <h3 style=\"margin-top:18px\">Bibliothèque<\/h3>\n    <input class=\"search\" id=\"search\" type=\"text\" placeholder=\"Chercher un effet\" aria-label=\"Chercher un effet\">\n    <div id=\"library\"><\/div>\n    <\/div>\n    <button type=\"button\" id=\"toTop\" class=\"toTop\" title=\"Revenir en haut\" aria-label=\"Revenir en haut\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 15l6-6 6 6\"/><\/svg><\/button>\n    <div id=\"tabStyle\" hidden style=\"display:none!important\">\n      <h2>Style commun<\/h2>\n      <p class=\"hint\" id=\"sHint\"><\/p>\n      <div class=\"sbtns\"><button type=\"button\" class=\"primary\" id=\"bAdd\">Ajouter des images<\/button><button type=\"button\" id=\"bClr\">Vider le lot<\/button><\/div>\n      <div id=\"sCtl\"><\/div>\n      <button type=\"button\" class=\"primary\" id=\"bExpAll\" style=\"width:100%;margin-top:16px\">Tout exporter (ZIP)<\/button>\n    <\/div>\n  <\/aside>\n\n  <section class=\"stage\" aria-label=\"Aperçu\">\n    <div class=\"viewport\" id=\"viewport\">\n      <canvas id=\"view\" aria-label=\"Image avec effets\"><\/canvas>\n      <button type=\"button\" id=\"btnClose\" class=\"closeimg\" aria-label=\"Fermer l'image\" title=\"Fermer l'image\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n      <button type=\"button\" id=\"btnCompare2\" class=\"cmp2\">Original<\/button>\n      <div class=\"pvbar\" id=\"pvbar\" hidden><span>Aperçu : <b id=\"pvName\"><\/b><\/span><button type=\"button\" class=\"primary\" id=\"pvAdd\">Ajouter<\/button><button type=\"button\" id=\"pvCancel\">Annuler<\/button><\/div>\n      <div class=\"drop\">\n        <div>\n          <h1>Déposez une image<\/h1>\n          <p>Glissez un fichier ici, collez-le depuis le presse-papiers, ou choisissez-le. Rien n'est envoyé : tout se passe dans votre navigateur.<\/p>\n          <div class=\"row2\">\n            <button type=\"button\" class=\"primary\" id=\"btnPick\">Choisir un fichier<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"strip\" id=\"strip\" aria-label=\"Images du lot\"><\/div>\n    <div class=\"bar\">\n      <div class=\"grp\"><span class=\"dim\" id=\"dims\">Aucune image<\/span><button type=\"button\" id=\"btnUndo\" disabled title=\"Revient avant la dernière action (Ctrl+Z)\"><svg class=\"ic\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10.5a5.5 5.5 0 0 1 0 11H11\"/><\/svg>Retour<\/button><button type=\"button\" id=\"btnRedo\" disabled title=\"Rétablit l'action annulée (Ctrl+Maj+Z ou Ctrl+Y)\"><svg class=\"ic\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 14 5-5-5-5\"/><path d=\"M20 9H9.5a5.5 5.5 0 0 0 0 11H13\"/><\/svg>Rétablir<\/button><\/div>\n      <div class=\"grp\">\n        <button type=\"button\" id=\"btnSeed\" title=\"Change au hasard les réglages de l'effet ouvert\">Aléatoire<\/button>\n        <label for=\"maxdim\" class=\"dim\">Taille de travail<\/label>\n        <select id=\"maxdim\">\n          <option value=\"1000\">1000 px<\/option>\n          <option value=\"1400\" selected>1400 px<\/option>\n          <option value=\"2000\">2000 px<\/option>\n          <option value=\"3000\">3000 px<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <aside class=\"stack pad\" aria-label=\"Pile d'effets\">\n    <div class=\"stackhead\"><button type=\"button\" class=\"mobtog\" id=\"togSt\" aria-expanded=\"true\">Réglages des effets<\/button><h2 id=\"stackTitle\">Pile d'effets<\/h2><button type=\"button\" id=\"btnClear\" class=\"ib\" style=\"padding:4px 8px;font-size:13px\">Tout effacer<\/button><\/div>\n    <div class=\"stackbar\">\n      <button type=\"button\" id=\"btnSaveList\" class=\"ib\" title=\"Enregistrer la pile actuelle sous un nom\">Enregistrer la liste<\/button>\n    <\/div>\n    <div class=\"saverow\" id=\"saveRow\">\n      <input class=\"search\" id=\"listName\" type=\"text\" maxlength=\"40\" placeholder=\"Nom de la liste\" aria-label=\"Nom de la liste\">\n      <button type=\"button\" id=\"btnListOk\" class=\"ib\">OK<\/button>\n      <button type=\"button\" id=\"btnListCancel\" class=\"ib\">Annuler<\/button>\n    <\/div>\n    <p class=\"hint\">Les effets s'appliquent de haut en bas. Changez l'ordre pour changer le rendu. Cliquez sur l'image pour placer l'effet ouvert ; glissez pour déplacer l'image (miroir, kaléidoscope) ; molette pour zoomer ou tourner.<\/p>\n    <div id=\"stack\"><\/div>\n    <div class=\"xp sec s8\"><h2>Export<\/h2><div class=\"xr\"><select id=\"xfmt\" title=\"Format\"><\/select><button type=\"button\" id=\"xdl\">Télécharger<\/button><\/div><div class=\"xqr\" id=\"xqr\" hidden><label><span>Qualité<\/span><span id=\"xqv\"><\/span><\/label><input type=\"range\" id=\"xq\" min=\"50\" max=\"100\" step=\"1\"><\/div><p id=\"xinfo\"><\/p><\/div>\n  <\/aside>\n<\/main>\n\n<input type=\"file\" id=\"file\" accept=\"image/*\" multiple hidden>\n<input type=\"file\" id=\"layerFile\" accept=\"image/*\" multiple hidden>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>\n/* ============ Utilitaires ============ */\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst hex=s=>{s=s.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');return[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]};\nfunction mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}\nconst cx=c=>c.getContext('2d',{willReadFrequently:true});\nconst getData=c=>cx(c).getImageData(0,0,c.width,c.height);\nfunction fromData(id){const c=mk(id.width,id.height);cx(c).putImageData(id,0,0);return c}\nfunction mapPx(src,fn){const id=getData(src);const d=id.data;for(let i=0;i<d.length;i+=4)fn(d,i);return fromData(id)}\nfunction rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst lumOf=(r,g,b)=>0.299*r+0.587*g+0.114*b;\n\nfunction bil(s,W,H,x,y,c){\n  x=clamp(x,0,W-1);y=clamp(y,0,H-1);\n  const x0=x|0,y0=y|0,x1=Math.min(x0+1,W-1),y1=Math.min(y0+1,H-1),fx=x-x0,fy=y-y0;\n  const a=s[(y0*W+x0)*4+c],b=s[(y0*W+x1)*4+c],d=s[(y1*W+x0)*4+c],e=s[(y1*W+x1)*4+c];\n  return(a*(1-fx)+b*fx)*(1-fy)+(d*(1-fx)+e*fx)*fy;\n}\nfunction warp(src,fn){\n  const W=src.width,H=src.height,s=getData(src).data,out=new ImageData(W,H),d=out.data,o={x:0,y:0};\n  for(let y=0;y<H;y++)for(let x=0;x<W;x++){\n    fn(x,y,o);const i=(y*W+x)*4;\n    d[i]=bil(s,W,H,o.x,o.y,0);d[i+1]=bil(s,W,H,o.x,o.y,1);d[i+2]=bil(s,W,H,o.x,o.y,2);d[i+3]=255;\n  }\n  return fromData(out);\n}\nfunction blurPass(src,dst,W,H,r,horiz){\n  const len=horiz?W:H,lines=horiz?H:W,stride=horiz?4:W*4,ls=horiz?W*4:4,div=2*r+1;\n  for(let l=0;l<lines;l++){\n    const base=l*ls;\n    for(let c=0;c<3;c++){\n      let sum=0;\n      for(let k=-r;k<=r;k++)sum+=src[base+clamp(k,0,len-1)*stride+c];\n      for(let i=0;i<len;i++){\n        dst[base+i*stride+c]=sum/div;\n        sum+=src[base+clamp(i+r+1,0,len-1)*stride+c]-src[base+clamp(i-r,0,len-1)*stride+c];\n      }\n    }\n    for(let i=0;i<len;i++)dst[base+i*stride+3]=255;\n  }\n}\nfunction boxBlurRGB(d,W,H,r,passes){\n  r=Math.round(r);if(r<1)return;\n  const tmp=new Uint8ClampedArray(d.length);\n  for(let n=0;n<(passes||2);n++){blurPass(d,tmp,W,H,r,true);blurPass(tmp,d,W,H,r,false)}\n}\n\n/* ============ Tramage (dithering) ============ */\nconst BAY={};\nfunction bayer(n){\n  if(BAY[n])return BAY[n];\n  let m=[[0]],s=1;\n  while(s<n){const ns=s*2,nm=Array.from({length:ns},()=>Array(ns));\n    for(let y=0;y<s;y++)for(let x=0;x<s;x++){const v=m[y][x]*4;nm[y][x]=v;nm[y][x+s]=v+2;nm[y+s][x]=v+3;nm[y+s][x+s]=v+1}\n    m=nm;s=ns}\n  return BAY[n]={m,n};\n}\nconst KERN={\n  fs:{d:16,k:[[1,0,7],[-1,1,3],[0,1,5],[1,1,1]]},\n  atkinson:{d:8,k:[[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]]},\n  jarvis:{d:48,k:[[1,0,7],[2,0,5],[-2,1,3],[-1,1,5],[0,1,7],[1,1,5],[2,1,3],[-2,2,1],[-1,2,3],[0,2,5],[1,2,3],[2,2,1]]},\n  stucki:{d:42,k:[[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2],[-2,2,1],[-1,2,2],[0,2,4],[1,2,2],[2,2,1]]}\n};\nconst PAL={\n  gameboy:['#0f380f','#306230','#8bac0f','#9bbc0f'],\n  cga:['#000000','#55ffff','#ff55ff','#ffffff'],\n  pico8:['#000000','#1D2B53','#7E2553','#008751','#AB5236','#5F574F','#C2C3C7','#FFF1E8','#FF004D','#FFA300','#FFEC27','#00E436','#29ADFF','#83769C','#FF77A8','#FFCCAA'],\n  c64:['#000000','#FFFFFF','#68372B','#70A4B2','#6F3D86','#588D43','#352879','#B8C76F','#6F4F25','#433900','#9A6759','#444444','#6C6C6C','#9AD284','#6C5EB5','#959595'],\n  sepia:['#2b1d12','#6b4a2f','#b98b5a','#f1dfbe'],\n  ambre:['#000000','#4a2400','#a85d00','#ffb000'],\n  vert:['#000000','#003b00','#00a000','#39ff14'],\n  neon:['#0b0b1e','#ff2a6d','#05d9e8','#f9f871']\n};\nconst PAL_OPTS=[['gameboy','Game Boy'],['cga','CGA'],['pico8','PICO-8'],['c64','Commodore 64'],['sepia','Sépia'],['ambre','Terminal ambre'],['vert','Terminal vert'],['neon','Néon']];\n\nfunction dither(src,p,method,env){\n  const sz=Math.max(1,p.size|0),w=Math.ceil(src.width/sz),h=Math.ceil(src.height/sz);\n  const sm=mk(w,h),sc=cx(sm);sc.imageSmoothingEnabled=true;sc.imageSmoothingQuality='high';sc.drawImage(src,0,0,w,h);\n  const id=sc.getImageData(0,0,w,h),d=id.data;\n  const mode=p.mode,L=Math.max(2,p.levels|0),step=255/(L-1);\n  const buf=new Float32Array(w*h*3);\n  const c255=p.contrast*2.55,cf=(259*(c255+255))/(255*(259-c255)),bo=p.bright*2.55;\n  for(let i=0,j=0;i<d.length;i+=4,j+=3){\n    let r=d[i],g=d[i+1],b=d[i+2];\n    if(mode==='mono'){r=g=b=lumOf(r,g,b)}\n    buf[j]=(r-128)*cf+128+bo;buf[j+1]=(g-128)*cf+128+bo;buf[j+2]=(b-128)*cf+128+bo;\n  }\n  const dark=hex(p.dark||'#000000'),light=hex(p.light||'#ffffff');\n  const pal=mode==='palette'?(PAL[p.palette]||PAL.gameboy).map(hex):null;\n  const kern=KERN[method];let kx,ky,kw;\n  if(kern){kx=kern.k.map(a=>a[0]);ky=kern.k.map(a=>a[1]);kw=kern.k.map(a=>a[2]/kern.d)}\n  const bay=method==='bayer'?bayer(parseInt(p.matrix)||4):null;\n  const rnd=method==='noise'?rng(env.seed*31+env.i):null;\n  const spread=(mode==='palette'?72:step)*((p.strength==null?100:p.strength)/100);\n  for(let y=0;y<h;y++)for(let x=0;x<w;x++){\n    const j=(y*w+x)*3;\n    let t=0;\n    if(bay)t=((bay.m[y%bay.n][x%bay.n]+0.5)/(bay.n*bay.n)-0.5)*spread;\n    else if(rnd)t=(rnd()-0.5)*spread;\n    const vr=clamp(buf[j]+t,0,255),vg=clamp(buf[j+1]+t,0,255),vb=clamp(buf[j+2]+t,0,255);\n    let qr,qg,qb;\n    if(pal){\n      let bi=0,bd=1e12;\n      for(let k=0;k<pal.length;k++){const a=pal[k],dr=vr-a[0],dg=vg-a[1],db=vb-a[2],dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;bi=k}}\n      qr=pal[bi][0];qg=pal[bi][1];qb=pal[bi][2];\n    }else{\n      qr=Math.round(vr/step)*step;qg=Math.round(vg/step)*step;qb=Math.round(vb/step)*step;\n    }\n    const o=(y*w+x)*4;\n    if(mode==='mono'){const k=qr/255;d[o]=dark[0]+(light[0]-dark[0])*k;d[o+1]=dark[1]+(light[1]-dark[1])*k;d[o+2]=dark[2]+(light[2]-dark[2])*k}\n    else{d[o]=qr;d[o+1]=qg;d[o+2]=qb}\n    d[o+3]=255;\n    if(kern){\n      const er=vr-qr,eg=vg-qg,eb=vb-qb;\n      for(let k=0;k<kx.length;k++){\n        const nx=x+kx[k],ny=y+ky[k];\n        if(nx<0||nx>=w||ny>=h)continue;\n        const q=(ny*w+nx)*3;buf[q]+=er*kw[k];buf[q+1]+=eg*kw[k];buf[q+2]+=eb*kw[k];\n      }\n    }\n  }\n  sc.putImageData(id,0,0);\n  const out=mk(src.width,src.height),oc=cx(out);oc.imageSmoothingEnabled=false;\n  oc.drawImage(sm,0,0,w,h,0,0,w*sz,h*sz);\n  return out;\n}\n\n/* ============ ASCII ============ */\nconst RAMPS={\n  standard:' .:-=+*#%@',\n  fine:\" .'^,:;Il!i><~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$\",\n  blocks:' ░▒▓█',\n  binary:' 01',\n  dots:' ·:•●'\n};\nfunction ascii(src,p){\n  const W=src.width,H=src.height,cell=Math.max(4,p.size);\n  const cols=Math.max(1,Math.floor(W/(cell*0.6))),rows=Math.max(1,Math.floor(H/cell));\n  const sm=mk(cols,rows),sc=cx(sm);sc.imageSmoothingEnabled=true;sc.imageSmoothingQuality='high';sc.drawImage(src,0,0,cols,rows);\n  const d=sc.getImageData(0,0,cols,rows).data;\n  const out=mk(W,H),o=cx(out);o.fillStyle=p.bg;o.fillRect(0,0,W,H);\n  let chars=[...(p.ramp==='custom'?(p.custom||' #'):RAMPS[p.ramp])];\n  if(chars.length<2)chars=[' ','#'];\n  if(p.invert)chars.reverse();\n  const cw=W/cols,ch=H/rows;\n  o.font=Math.round(ch*1.05)+'px ui-monospace,Menlo,Consolas,monospace';\n  o.textAli
